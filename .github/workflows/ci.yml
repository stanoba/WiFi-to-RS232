name: CI & Unit Tests

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'software/**'
      - 'emulator/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'software/**'
      - 'emulator/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test_and_build:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & Dependencies
        run: |
          pip install -U platformio esptool

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('software/platformio.ini', 'emulator/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Run Software Host Unit Tests
        run: |
          pio test -d software -e native

      - name: Run Emulator Host Unit Tests
        run: |
          pio test -d emulator -e native

      - name: Compile Pylon Smart Monitor Firmware (ESP32, S2, C3)
        run: |
          pio run -d software -e wemos_d1_mini32 -e lolin_s2_mini -e esp32_c3_super_mini

      - name: Compile Pylon BMS Emulator Firmware (ESP32, S2, C3)
        run: |
          pio run -d emulator -e wemos_d1_mini32 -e lolin_s2_mini -e esp32_c3_super_mini
