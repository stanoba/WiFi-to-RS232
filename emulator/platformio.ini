[platformio]
default_envs = wemos_d1_mini32

[env:wemos_d1_mini32]
platform = espressif32@6.12.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, esp32_exception_decoder

build_flags = 
    -D CORE_DEBUG_LEVEL=0

[env:lolin_s2_mini]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 1
extra_scripts = pre:limit_jobs.py

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D BOARD_HAS_PSRAM
    -Os

[env:esp32_c3_super_mini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time, esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 1
extra_scripts = pre:limit_jobs.py

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Os

[env:native]
platform = native
test_framework = unity
extra_scripts = pre:test_env_path.py
platform_packages = 
    toolchain-gccmingw32
build_flags = 
    -std=gnu++17
    -static
    -static-libgcc
    -static-libstdc++
    -I test/include
    -I include






