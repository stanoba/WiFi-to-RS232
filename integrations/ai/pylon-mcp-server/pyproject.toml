[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylon-mcp-server"
version = "1.0.0"
description = "FastMCP server for Pylontech battery stacks monitored via WiFi-to-RS232 ESP32 Bridge or BMS Emulator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "stanoba" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0"
]

[project.scripts]
pylon-mcp = "pylon_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
